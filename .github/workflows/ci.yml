name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t .
      - name: mypy
        run: uv run mypy
      - name: The library itself must not run external programs
        run: |
          ! grep -rnE "subprocess|os\.system|os\.popen|shutil\.which" src/gmx_harness --include=*.py --exclude-dir=data
